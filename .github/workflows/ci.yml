name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Tags are never cancelled:
# a release build that vanished halfway is worse than a slow queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # One Windows job: the token store and the loopback listener are the two
          # places where this library could be POSIX-only without anyone noticing.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refuse a dev-version tag
        # Dev versions come from commits after a release (0.2.1.dev3), never from
        # tags. A tag like v0.3.0.dev1 also makes every later build fail, because
        # setuptools-scm cannot number a dev build of a dev build.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF_NAME" =~ [.-]?dev[0-9]*$ ]]; then
            echo "::error::Don't tag dev versions: every commit after a release already builds one."
            echo "Delete this tag (git push --delete origin $GITHUB_REF_NAME), or every later build fails."
            exit 1
          fi

      - name: Build the wheel and the sdist
        run: uv build --out-dir dist

      - name: Refuse a tag that is not a version in its standard form
        # The version comes from the tag, but normalized to PEP 440: `v0.2.0-rc.1`
        # builds 0.2.0rc1. A tag that does not match its own build would
        # mislead anyone comparing the two, so the wheel's filename is the check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="dist/coho_management_sdk-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not a version in PEP 440's standard form."
            echo "Use forms like v0.2.0, v0.2.0a1, v0.2.0b1 or v0.2.0rc1. Built instead:"
            ls -1 dist
            exit 1
          fi

      - name: Check the packaging metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Install the wheel on its own and import it
        # A clean environment with no dev tools and no source tree: this is what a
        # consumer gets. It catches missing package data (py.typed), a broken
        # dependency list, and an sdist that forgot a module.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python ./dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import pathlib
          from importlib.metadata import version
          import coho_management_sdk
          from coho_management_sdk import Coho, CohoError  # noqa: F401  the documented entry points
          assert version("coho-management-sdk") == coho_management_sdk.__version__, "metadata and __version__ disagree"
          assert (pathlib.Path(coho_management_sdk.__file__).parent / "py.typed").is_file(), "py.typed did not ship"
          print("imported coho-management-sdk", coho_management_sdk.__version__, "from a clean environment")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: coho-management-sdk-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-management-sdk-dist
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An alpha, beta or release candidate is a pre-release on GitHub too, so
          # it never shows as the latest release.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "coho-management-sdk $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag $prerelease
          fi

  publish-pypi:
    name: publish to PyPI
    # Skipped unless the repository variable PUBLISH_TO_PYPI is "true".
    # See CONTRIBUTING.md — it needs a trusted publisher and a `pypi` environment.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coho-management-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-management-sdk-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
