name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Tags are never cancelled:
# a release build that vanished halfway is worse than a slow queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # One Windows job: the token store and the loopback listener are the two
          # places where this library could be POSIX-only without anyone noticing.
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build the wheel and the sdist
        run: uv build --out-dir dist

      - name: Refuse a tag that disagrees with the version
        # hatchling names the wheel from __version__, so the filename is the check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="dist/coho_management_sdk-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ in src/coho_management_sdk/_version.py"
            echo "expected $expected, built:"
            ls -1 dist
            exit 1
          fi

      - name: Check the packaging metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Install the wheel on its own and import it
        # A clean environment with no dev tools and no source tree: this is what a
        # consumer gets. It catches missing package data (py.typed), a broken
        # dependency list, and an sdist that forgot a module.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python ./dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import pathlib
          from importlib.metadata import version
          import coho_management_sdk
          from coho_management_sdk import Coho, CohoError  # noqa: F401  the documented entry points
          assert version("coho-management-sdk") == coho_management_sdk.__version__, "metadata and __version__ disagree"
          assert (pathlib.Path(coho_management_sdk.__file__).parent / "py.typed").is_file(), "py.typed did not ship"
          print("imported coho-management-sdk", coho_management_sdk.__version__, "from a clean environment")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: coho-management-sdk-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: coho-management-sdk-dist
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "coho-management-sdk $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  publish-pypi:
    name: publish to PyPI
    # Skipped unless the repository variable PUBLISH_TO_PYPI is "true".
    # See CONTRIBUTING.md — it needs a trusted publisher and a `pypi` environment.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coho-management-sdk/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: coho-management-sdk-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
