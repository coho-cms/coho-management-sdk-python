openapi: 3.1.0

info:
  title: Coho delivery API
  version: "2.1.0"
  description: |
    Read-only delivery of published content, addressed by `{ref}`.

    ## Status of this document (doc 10 §6.6)

    **Version 2.0.0 is the target contract, and the implementations do not
    serve it yet.** The envelope, `depth`, and the by-slug and by-id operations
    are specified here before either implementation changes,
    so neither can define them unilaterally (M4-10′). Until they land, the two
    implementations serve the 1.0.0 shapes, and the contract suite's shape
    assertions are the place where the difference shows.

    This is a breaking change applied in place. The path prefix stays `/v1`
    because nothing is published yet. Once a client depends on it, a change like
    this is `/v2`.

    ## One contract, two implementations (M4-10′)

    This document is implemented **twice** — over snapshots in `:api-runtime`, and
    over the live overlay in `:api-authoring` for `live`-tier refs. It is not a
    description of one service; it is the agreement between two.

    That is not duplication for its own sake. Arch doc §5 puts `{ref}` in the path
    specifically so *"preview deployments, per-branch CDN cache keys, and
    per-branch API tokens all fall out naturally"* — and that property survives
    only if a preview client speaks the **same contract** as production. If dev
    previews spoke the authoring read shape instead, preview code would differ
    from production code, and shape bugs would surface in QA rather than in dev,
    which is the failure preview exists to prevent.

    `TM-D1` asserts the two implementations return byte-identical bodies for every
    operation here. **Anything an implementation does that this document does not
    describe is a divergence**, including on error paths — which is exactly where
    a divergence would survive review.

    ## The two postures are not the same

    | | Snapshot implementation | Live implementation |
    |---|---|---|
    | Serves refs resolving to | a tag | a branch tip |
    | SLO | N1 — p99 < 80 ms | N2 — p99 < 150 ms |
    | Posture | public, CDN-frontable | **private, BFF-fronted** |
    | Credential | a delivery key, unless the environment is public | what the BFF forwards: a person's actor, or a project token |

    ⚠️ **Live previews inherit the private posture.** A `live`-tier environment is
    served by the overlay implementation, which sits behind the authoring boundary
    where `X-Coho-Actor` is unverified by design: network position vouches for the
    BFF, and the BFF for who is asking. A "public preview URL pointed at a feature branch"
    therefore routes through the BFF, **not** through the CDN edge. Integrators
    building the per-client-preview case in doc 06 §1 need to know this before
    they design around it.

    ## Locale projection is a contract rule, not an implementation detail (M4-15)

    A response carries **one locale's values, flattened** — never the multi-locale
    map the authoring API returns.

    > A localized field with no value in the requested locale is **omitted from
    > the response — key absent, not null.**

    Omission is the only rule that needs no configuration. A fallback chain would
    require a declared default locale and a precedence order, neither of which
    exists in this tier and both of which are policy rather than storage. Emitting
    `null` would additionally be a lie: it asserts the field has no value, when the
    truth is that it has no value *in this locale*.

    A locale nobody has translated into needs no special case — it is simply the
    extreme where every localized field is untranslated, and the response is the
    node with its non-localized fields and nothing else.

    ## ⚠️ Every ref needs a key, in the snapshot implementation (doc 20 DT-3)

    Environments **and tags**, `prod` included. The expectation is that a
    customer's own site BFF holds the key and calls delivery server-side, so
    content is never public unless somebody decided it should be. Tags too,
    because a tag is directly addressable: without a key,
    `/v1/projects/{p}/v1.5.0-rc.1/entries` reads a release candidate that no
    public environment points at.

    A project may open a **named environment** to keyless reads. That covers the
    environment's name only — the tag behind a public `prod` stays key-required
    when addressed directly.

    | Refusal | Status | Why that one |
    |---|---|---|
    | No key presented | `401 KEY_REQUIRED` | The same answer whatever project id was asked for, so an unauthenticated caller learns nothing by trying ids |
    | A key that does not grant this project | `404 PROJECT_NOT_FOUND` | Indistinguishable from a project that never existed: one customer's key must not confirm another's |
    | An account past its plan's delivery cap: Free's 2 GB a month (doc 45 §7.1) | `403 PLAN_LIMIT` | After the key, so only a caller the project would serve learns it; `detail` says when delivery resumes |

    ⚠️ **A keyed response is `private`, and a shared cache must not store it**
    (doc 20 DT-7). Caching one under a URL that carries no credential would serve
    it to whoever asks for that URL, and would turn revocation from seconds into
    that cache's TTL. An edge that verifies the key itself may cache it; nothing
    else may. Responses on a **public** environment are `public` and cache
    normally.

    ## ⚠️ Every read is authorized, in the live implementation (doc 38 IR-9)

    The live implementation takes no key. It takes what the BFF forwards: a
    person's actor for the account in the BFF's path, or a project token (doc 29),
    which the BFF passes on unchecked. Each read needs `content:read` on the
    project in the path, exactly as a read through the authoring API does: a role
    there, or a token for it, under that account. A preview client holds a project
    token, as a site holds a delivery key.

    | Refusal | Status | Why that one |
    |---|---|---|
    | No credential, something that is not one, or a token that has expired or been revoked | `401 UNAUTHENTICATED` | The authoring API's answer to the same check. Expiry and revocation are told only to a token this project issued (doc 29 PT-10), so they confirm nothing its holder did not know |
    | A credential that does not reach this project | `404 PROJECT_NOT_FOUND` | Byte for byte the snapshot implementation's answer: a made-up token, another project's, another account's path, or a person with no role there |
    | A suspended or closed account, or a suspended person | `403 ACCOUNT_SUSPENDED`, `ACCOUNT_CLOSED`, `USER_SUSPENDED` | The authoring API's codes. Previews stop with editing, while the snapshot implementation never refuses for this: a suspended account's site keeps serving (UL-11) |

    ## Reference resolution is a bounded walk (D29)

    A link is a node id, never a slug. `depth` asks the data tier to follow
    references from each root to a requested depth in **one read**: the roots and
    everything reachable within that depth come back as one flat map, keyed by
    id. The walk is mechanical — the data tier knows where links are, not what
    they mean. What a document's links *mean*, how a page is composed from them,
    and which keys and caches a customer's site uses sit in a content tier above
    this contract.

    ## Asset fields are embedded (2.1.0, doc 40 §14.6)

    An asset field holds files. Unlike a reference it is **embedded**: the entry's
    field carries each asset as an `Asset` object, never an id to look up, and an
    asset is never part of the walk, so `depth` keeps meaning entries. An asset is
    never an entry either: reading its id as one is `ENTRY_NOT_FOUND`, and by-id
    reports it `absent`.

    The asset is as it is on the ref read, so a tag delivers it as it was at the
    tag. Its URLs are built when the response is made, so they follow the
    deployment's asset domain whenever the release was cut.

    **An asset that is gone** on the ref, deleted or never there, is `null` in a
    single asset field and left out of a list, and either way is named in the
    response's `warnings`. It is never an error: one missing image must not take a
    page down. A single asset field can therefore be `null` whatever its type says.

    ⚠️ An asset's URLs are public to anyone holding them.

    ## What is deliberately absent

    - **No writes.** Delivery is read-only over already-published content.
    - **No filtering beyond type.** Filters are deferred; `order` and pagination
      are the only other ways to narrow a listing.
    - **No type introspection.** Delivery serves content, not types. The IR, which
      describes a ref's content types for code generation, is produced by the
      authoring tier for engineers and their build pipelines. It is not part of
      what a site reads at runtime (see doc 10 §6.6).

servers:
  - url: https://delivery.coho.example/v1/projects/{project}
    description: |
      Snapshot delivery, CDN-frontable. **The project is in the path** (doc 20
      DT-2): a cache keys on URLs, so two tenants' `prod` must be two URLs — a
      key that selected the project instead would force an intermediary either
      to vary on the credential or to serve one customer's content to another.
    variables:
      project:
        default: "00000000-0000-7000-8000-000000000000"
        description: The project id. Selects; it does not authorize.
  - url: https://authoring.coho.example/v1/live/{project}
    description: Live delivery. Private — BFF only, never the public edge.
    variables:
      project:
        default: "00000000-0000-7000-8000-000000000000"

security:
  - deliveryKey: []

paths:
  /{ref}/entries:
    parameters:
      - $ref: '#/components/parameters/ref'
      - name: type
        in: query
        schema: { type: string }
        description: |
          Filter to a content type, by its slug as resolved on this ref, and the types
          that extend it (doc 05 I1): `type=page` lists every service page and landing
          page too. Each entry still names its own `type`.
      - name: exact
        in: query
        schema: { type: boolean }
        description: With `type`, that type's own entries only, not its descendants'.
      - $ref: '#/components/parameters/locale'
      - $ref: '#/components/parameters/depth'
      - name: order
        in: query
        schema: { type: string }
        description: |
          A field id, optionally prefixed `-` for descending. The list is ordered by
          that field, then by id ascending, so the order is total and pagination over
          it is stable.

          **An order needs a `type`.** A field is sorted within its type, because the
          same id can mean different things on different types. An order without a
          `type` is `400 INVALID_QUERY`.

          **Sortable: `integer`, `number` and `datetime` fields** that the named type
          declares and has not omitted, whether or not it has entries on this ref: a
          query's validity depends on the schema, never on the content (doc 38, IR-8).
          A type with no entries is an empty page. Any other field is
          `400 INVALID_QUERY`. Text, choice and boolean are not sortable yet: they need
          sorted doc values in the index, which is a format change.

          A value that is missing for an entry sorts **last**, whichever way the order
          runs. With no `order`, the list is by id ascending.
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
    get:
      tags: [Delivery]
      summary: List entries on this ref
      description: |
        Pagination reuses the shape already shipped on the authoring
        `GET /entries` in its paging, not its envelope: `limit`/`offset` with a
        `hasMore` flag, computed by fetching one extra row and discarding it.

        The page is in the order `order` asks for, and by id where it does not ask (see
        `order`). That order is carried by `roots`. Lookup is through `entries`.
      operationId: listEntries
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryListResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /{ref}/entries/{id}:
    parameters:
      - $ref: '#/components/parameters/ref'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/locale'
      - $ref: '#/components/parameters/depth'
    get:
      tags: [Delivery]
      summary: One entry on this ref, with its references to a requested depth
      description: |
        The root is `roots[0]`, and `entries[roots[0]]` is the entry. Anything it
        references within `depth` hops is also in `entries`.
      operationId: getEntry
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryGraph' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /{ref}/entries-by-slug/{slug}:
    parameters:
      - $ref: '#/components/parameters/ref'
      - name: slug
        in: path
        required: true
        schema: { type: string }
        description: |
          Matched exactly. A slug is unique per ref (D24), so there is at most one
          root. The returned entry's `slug` always equals the requested one.
      - $ref: '#/components/parameters/locale'
      - $ref: '#/components/parameters/depth'
    get:
      tags: [Delivery]
      summary: One entry on this ref, looked up by slug
      description: |
        A sibling collection to `entries/{id}`, not a sub-resource of it. The
        `entries-by-` prefix keeps it from reading as `entries/{id}/…`, as
        `references` and `history` do on the authoring side.
      operationId: getEntryBySlug
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryGraph' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /{ref}/entries-by-id:
    parameters:
      - $ref: '#/components/parameters/ref'
      - $ref: '#/components/parameters/ids'
      - $ref: '#/components/parameters/locale'
      - $ref: '#/components/parameters/depth'
    get:
      tags: [Delivery]
      summary: Several entries on this ref, by id, in one read
      description: |
        `roots` holds the requested ids that exist on this ref, sorted by id, with
        duplicates collapsed. The caller already holds the ids it asked for, so the
        request's order is not carried back: `entries` is keyed by id for lookup. A
        requested id that is not on this ref is not an error: it is not a root, and it
        is reported under `unresolved` as `absent`, the same way a dangling reference is.

        GET, so the response is cacheable on an immutable tag.
      operationId: getEntriesById
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryGraph' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

components:

  securitySchemes:
    deliveryKey:
      type: http
      scheme: bearer
      description: |
        An opaque delivery key (doc 16 AU-3), recognised against a document the
        instance already holds — so verification costs no I/O.

        ⚠️ **Never a query parameter.** A URL reaches access logs, referrer
        headers and browser history, which is where credentials leak.

  parameters:
    ref:
      name: ref
      in: path
      required: true
      description: |
        A tag or an environment. **A ref an implementation does not serve is
        `404`** — not a redirect and not a more helpful error.

        That is deliberate and it is the one place the temptation to diverge is
        strongest: the private implementation could afford to be more informative.
        It must not be. There is one contract, `TM-D1` asserts the two are
        indistinguishable at the contract boundary, and an error shape that differs
        by implementation is a divergence that survives review precisely because it
        only appears on an error path.
      schema: { type: string }

    locale:
      name: locale
      in: query
      description: |
        BCP-47-ish, with **no registry** — locales are whatever authors have used.
        Omitting it returns non-localized fields only, which is the same answer as
        requesting a locale nobody has translated into.
      schema: { type: string }

    depth:
      name: depth
      in: query
      description: |
        How many reference hops to follow from each root. `0` returns the roots
        alone. Each hop follows every reference field, including references inside
        repeaters, which cost no depth of their own. Above 5 is `400 INVALID_QUERY`.

        The walk is capped at **500** entries in `entries`, across the whole
        response. A walk that would exceed the cap is `400 RESOLUTION_LIMIT`, which
        fails loudly rather than returning a partial graph. The cap is a placeholder
        until it is set from measurement (doc 10 §6.6).

        Applies to every entry read, so a single read, a by-slug read, a by-id read
        and a list all answer with the same envelope.
      schema: { type: integer, minimum: 0, maximum: 5, default: 0 }

    ids:
      name: ids
      in: query
      required: true
      description: |
        Comma-separated entry ids, at most 100. More than 100, a malformed id, or
        an empty list is `400 INVALID_QUERY`. Duplicates collapse.
      schema: { type: string }

  headers:
    ETag:
      description: |
        On a **tag** ref this is the manifest's `content_hash` (M4-7f) — the
        artifact is immutable and already carries one, so the strongest possible
        validator is also the honest one. This is where §4.9.1's *"a cache key that
        can never go stale"* finally cashes out at the HTTP layer.

        On an **environment** it is the content hash of the tag the environment
        currently resolves to — still a strong validator, because it names exactly
        the content served, and it changes when a promotion does.

        On a **live** ref it is a weak validator at best, because the content moves.
      schema: { type: string }

    CacheControl:
      description: |
        Decided by what the ref resolves through, because that is what decides
        whether the response can change (doc 20 DT-5):

        | Ref | `Cache-Control` |
        |---|---|
        | a **tag**, named directly | `public, max-age=31536000, immutable` — the artifact cannot change, so nothing weaker would be truthful |
        | an **environment** | `public, max-age=<short>` — it moves on every promotion, and a rollback must be seen |
        | a **live** ref | `no-cache` — its content moves with every write, so any freshness claim would be a guess |

        ⚠️ **An environment is never `immutable`**, even though the tag behind it
        is. That would pin a cache to the release it first saw for a year,
        rollbacks included. The short `max-age` is an implementation default, not
        a contract value: a client may depend on an environment never being
        `immutable`, and on nothing about the number.
      schema: { type: string }

  responses:
    NotModified:
      description: |
        `If-None-Match` named the `ETag` this response would carry: the client's
        copy is current (doc 41 MT-9). Checked after the credential, so a refused
        key is refused rather than told its copy is fresh, and before the query,
        so a revalidation costs almost nothing. `ETag` and `Cache-Control` go out
        with it, so an environment's freshness restarts. The snapshot
        implementation answers it; a live ref, whose content moves, does not.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }

    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Entry:
      type: object
      required: [id, slug, type, fields]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: |
            Unique per ref (D24). Required: every node has one, so an entry
            without a slug is not a state the contract needs to describe.
        type:
          type: string
          description: The content type's slug **as resolved on this ref** (D24).
        locale:
          type: string
          description: |
            The locale this projection was made for. Absent when none was
            requested.
        fields:
          type: object
          additionalProperties: true
          description: |
            The resolved node body, projected to one locale and flattened. A
            localized field untranslated in this locale is **absent**, not null.
            Reference fields hold ids, never slugs, and are never expanded here:
            the entries they point at, if within depth, are in `entries`. Asset
            fields hold an `Asset`, or a list of them, embedded (2.1.0); a single
            asset field whose asset is gone is `null`.

    EntryGraph:
      type: object
      required: [roots, entries, unresolved]
      properties:
        roots:
          type: array
          items: { type: string, format: uuid }
          description: |
            The entries that were asked for and exist on this ref. Single reads have
            one root. By-id reads are sorted by id, and leave out the ids that are not
            on the ref: those are reported under `unresolved`. The list is in list
            order, which is what `order` asks for. **Order lives here**, not in
            `entries`, which is a map and carries no order.
        entries:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Entry' }
          description: |
            Every root and every entry reachable from a root within `depth`, keyed
            by canonical id. Each id appears once. A reference back to a root
            resolves here like any other reference, so a walker needs no special
            case for roots. Keys are sorted, so bodies are byte-identical across
            the two implementations.
        unresolved:
          type: object
          additionalProperties:
            type: string
            enum: [depth, absent]
          description: |
            An id that was requested or referenced and is not in `entries`.
            `depth`: it exists on this ref but lies beyond the requested depth.
            `absent`: it is not on this ref — deleted, never existed, or not yet
            merged. The two are different questions and are answered separately.
            Always present, possibly empty.
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
          description: |
            What this response could not give in full (2.1.0): an asset field whose
            asset is gone. Sorted by entry, field and asset. **Absent when there is
            nothing to say**, never an empty list.

    Warning:
      type: object
      required: [code, entry, field, asset]
      properties:
        code:
          type: string
          enum: [ASSET_MISSING]
          description: What happened. More codes may come; a client should show an unknown one, not fail.
        entry: { type: string, format: uuid, description: The entry whose field it is. }
        field: { type: string, description: The asset field. }
        asset: { type: string, format: uuid, description: The asset it linked. }

    Asset:
      type: object
      required: [id, file]
      description: |
        An asset as an asset field embeds it (2.1.0, doc 40 §14.6). Absent values
        are left out, never `null`.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        alt: { type: string, description: Alternative text, for an image. }
        focalPoint:
          type: object
          required: [x, y]
          description: Where a crop centres, as fractions of the width and height.
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
        file:
          type: object
          required: [mediaType, byteSize, filename]
          properties:
            mediaType: { type: string, description: As sniffed from the bytes at upload. }
            byteSize: { type: integer, format: int64 }
            width: { type: integer, description: Raster images only. }
            height: { type: integer, description: Raster images only. }
            filename: { type: string }
        url:
          type: string
          format: uri
          description: The original, from the asset CDN. Absent where the deployment serves none.
        imageUrl:
          type: string
          format: uri
          description: |
            Raster images only: the transform base. Append `w`, `h`, `fit`, `fx`,
            `fy`, `fm`, `q` and `bg` to resize at the edge (doc 40 §6.1).

    EntryListResponse:
      allOf:
        - $ref: '#/components/schemas/EntryGraph'
        - type: object
          required: [hasMore]
          properties:
            hasMore:
              type: boolean
              description: Whether another page exists after this one.

    Problem:
      type: object
      required: [code, title, status]
      properties:
        code:
          type: string
          description: |
            The stable identifier clients branch on. Status is deliberately
            coarse, so a client switching on status is switching on almost nothing.
          enum: [REF_NOT_FOUND, ENTRY_NOT_FOUND, INVALID_QUERY, RESOLUTION_LIMIT, ARTIFACT_UNREADABLE, KEY_REQUIRED, PROJECT_NOT_FOUND, POOL_UNAVAILABLE, UNAUTHENTICATED, ACCOUNT_SUSPENDED, ACCOUNT_CLOSED, USER_SUSPENDED, PLAN_LIMIT]
          # ARTIFACT_UNREADABLE (500) is served only by the snapshot implementation,
          # when the artifact a ref resolves to is in a format this build cannot read
          # (doc 15 AF-3). The live implementation reads no artifact, so it cannot
          # produce it. The contract suite does not yet test it on either side.
          #
          # KEY_REQUIRED (401) is served only by the snapshot implementation, which
          # takes a delivery key (doc 20 DT-3), when none is presented. PROJECT_NOT_FOUND
          # (404) is served by both, byte-identically, when the credential presented
          # does not reach the project: the same answer as a project that does not exist.
          #
          # UNAUTHENTICATED (401), ACCOUNT_SUSPENDED, ACCOUNT_CLOSED and USER_SUSPENDED
          # (403) are served only by the live implementation, which authorizes a read as
          # the authoring API does and refuses with that API's codes for the same checks
          # (doc 38 IR-9). The snapshot implementation keeps serving a suspended
          # account's site (UL-11), so it produces none of the 403s.
          #
          # PLAN_LIMIT (403) is served by both when the project's account is past a cap of
          # its plan (doc 45 §7.1): the snapshot implementation for delivery a month, the live
          # one for live reads a day. Its detail says when the refusal ends.
          #
          # POOL_UNAVAILABLE (503) is served by the router in front of the snapshot
          # implementation (doc 31), when a project's pool has no instance configured
          # there: a deployment that has drifted, not a missing project. The router's
          # PROJECT_NOT_FOUND, for a project it does not place, is byte-identical to
          # the instance's, so a caller cannot tell which layer answered.
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
