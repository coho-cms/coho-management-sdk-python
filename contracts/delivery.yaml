openapi: 3.1.0

info:
  title: Coho delivery API
  version: "1.0.0"
  description: |
    Read-only delivery of published content, addressed by `{ref}`.

    ## One contract, two implementations (M4-10')

    This document is implemented **twice** — over snapshots in `:api-runtime`, and
    over the live overlay in `:api-authoring` for `live`-tier refs. It is not a
    description of one service; it is the agreement between two.

    That is not duplication for its own sake. Arch doc §5 puts `{ref}` in the path
    specifically so *"preview deployments, per-branch CDN cache keys, and
    per-branch API tokens all fall out naturally"* — and that property survives
    only if a preview client speaks the **same contract** as production. If dev
    previews spoke the authoring read shape instead, preview code would differ
    from production code, and shape bugs would surface in QA rather than in dev,
    which is the failure preview exists to prevent.

    `TM-D1` asserts the two implementations return byte-identical bodies for every
    operation here. **Anything an implementation does that this document does not
    describe is a divergence**, including on error paths — which is exactly where
    a divergence would survive review.

    ## The two postures are not the same

    | | Snapshot implementation | Live implementation |
    |---|---|---|
    | Serves refs resolving to | a tag | a branch tip |
    | SLO | N1 — p99 < 80 ms | N2 — p99 < 150 ms |
    | Posture | public, CDN-frontable | **private, BFF-fronted** |

    ⚠️ **Live previews inherit the private posture.** A `live`-tier environment is
    served by the overlay implementation, which sits behind the authoring boundary
    where `X-Coho-Actor` is unverified by design and network position is the
    authentication control. A "public preview URL pointed at a feature branch"
    therefore routes through the BFF, **not** through the CDN edge. Integrators
    building the per-client-preview case in doc 06 §1 need to know this before
    they design around it.

    ## Locale projection is a contract rule, not an implementation detail (M4-15)

    A response carries **one locale's values, flattened** — never the multi-locale
    map the authoring API returns.

    > A localized field with no value in the requested locale is **omitted from
    > the response — key absent, not null.**

    Omission is the only rule that needs no configuration. A fallback chain would
    require a declared default locale and a precedence order, neither of which
    exists in this tier and both of which are policy rather than storage. Emitting
    `null` would additionally be a lie: it asserts the field has no value, when the
    truth is that it has no value *in this locale*.

    A locale nobody has translated into needs no special case — it is simply the
    extreme where every localized field is untranslated, and the response is the
    node with its non-localized fields and nothing else.

    ## ⚠️ Every ref needs a key, in the snapshot implementation (doc 20 DT-3)

    Environments **and tags**, `prod` included. The expectation is that a
    customer's own site BFF holds the key and calls delivery server-side, so
    content is never public unless somebody decided it should be. Tags too,
    because a tag is directly addressable: without a key,
    `/v1/projects/{p}/v1.5.0-rc.1/entries` reads a release candidate that no
    public environment points at.

    A project may open a **named environment** to keyless reads. That covers the
    environment's name only — the tag behind a public `prod` stays key-required
    when addressed directly.

    | Refusal | Status | Why that one |
    |---|---|---|
    | No key presented | `401 KEY_REQUIRED` | The same answer whatever project id was asked for, so an unauthenticated caller learns nothing by trying ids |
    | A key that does not grant this project | `404 PROJECT_NOT_FOUND` | Indistinguishable from a project that never existed: one customer's key must not confirm another's |

    The live implementation takes no key. It sits behind the authoring boundary,
    where network position is the control.

    ⚠️ **A keyed response is `private`, and a shared cache must not store it**
    (doc 20 DT-7). Caching one under a URL that carries no credential would serve
    it to whoever asks for that URL, and would turn revocation from seconds into
    that cache's TTL. An edge that verifies the key itself may cache it; nothing
    else may. Responses on a **public** environment are `public` and cache
    normally.

    ## What is deliberately absent

    - **No `include=`.** M4-6 settled that the stored document is the resolved node
      body verbatim, and D25 put references in the content tier. **This tier does
      not know what a link is**, so it cannot expand one. A future content tier
      could add expansion as a wrapper without changing this contract.
    - **No writes.** Delivery is read-only over already-published content.
    - **No type introspection.** Types govern the build (M4-7a) but are not part of
      the delivery surface in M4; a client that needs the schema reads it from the
      authoring API or the tag export.

servers:
  - url: https://delivery.coho.example/v1/projects/{project}
    description: |
      Snapshot delivery, CDN-frontable. **The project is in the path** (doc 20
      DT-2): a cache keys on URLs, so two tenants' `prod` must be two URLs — a
      key that selected the project instead would force an intermediary either
      to vary on the credential or to serve one customer's content to another.
    variables:
      project:
        default: "00000000-0000-7000-8000-000000000000"
        description: The project id. Selects; it does not authorize.
  - url: https://authoring.coho.example/v1/live/{project}
    description: Live delivery. Private — BFF only, never the public edge.
    variables:
      project:
        default: "00000000-0000-7000-8000-000000000000"

security:
  - deliveryKey: []

paths:
  /{ref}/entries:
    parameters:
      - $ref: '#/components/parameters/ref'
      - name: type
        in: query
        schema: { type: string }
        description: Filter to one content type, by its slug as resolved on this ref.
      - $ref: '#/components/parameters/locale'
      - name: order
        in: query
        schema: { type: string }
        description: |
          A declared scalar field, optionally prefixed `-` for descending.

          **The sortable set is simply what the type declares** (M4-7c): the build
          indexes every declared field by its `FieldType`, so there is no separate
          allowlist to maintain and drift out of date. `repeater` and `json` are
          stored but not indexed, so they are neither sortable nor filterable.
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
    get:
      tags: [Delivery]
      summary: List entries on this ref
      description: |
        Pagination reuses the shape already shipped on the authoring
        `GET /entries` rather than inventing a second one: `limit`/`offset` with a
        `hasMore` flag, computed by fetching one extra row and discarding it.
      operationId: listEntries
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryListResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /{ref}/entries/{id}:
    parameters:
      - $ref: '#/components/parameters/ref'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/locale'
    get:
      tags: [Delivery]
      summary: One entry on this ref
      operationId: getEntry
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404': { $ref: '#/components/responses/Problem' }

components:

  securitySchemes:
    deliveryKey:
      type: http
      scheme: bearer
      description: |
        An opaque delivery key (doc 16 AU-3), recognised against a document the
        instance already holds — so verification costs no I/O.

        ⚠️ **Never a query parameter.** A URL reaches access logs, referrer
        headers and browser history, which is where credentials leak.
  parameters:
    ref:
      name: ref
      in: path
      required: true
      description: |
        A tag or an environment. **A ref an implementation does not serve is
        `404`** — not a redirect and not a more helpful error.

        That is deliberate and it is the one place the temptation to diverge is
        strongest: the private implementation could afford to be more informative.
        It must not be. There is one contract, `TM-D1` asserts the two are
        indistinguishable at the contract boundary, and an error shape that differs
        by implementation is a divergence that survives review precisely because it
        only appears on an error path.
      schema: { type: string }

    locale:
      name: locale
      in: query
      description: |
        BCP-47-ish, with **no registry** — locales are whatever authors have used.
        Omitting it returns non-localized fields only, which is the same answer as
        requesting a locale nobody has translated into.
      schema: { type: string }

  headers:
    ETag:
      description: |
        On a **tag** ref this is the manifest's `content_hash` (M4-7f) — the
        artifact is immutable and already carries one, so the strongest possible
        validator is also the honest one. This is where §4.9.1's *"a cache key that
        can never go stale"* finally cashes out at the HTTP layer.

        On an **environment** it is the content hash of the tag the environment
        currently resolves to — still a strong validator, because it names exactly
        the content served, and it changes when a promotion does.

        On a **live** ref it is a weak validator at best, because the content moves.
      schema: { type: string }

    CacheControl:
      description: |
        Decided by what the ref resolves through, because that is what decides
        whether the response can change (doc 20 DT-5):

        | Ref | `Cache-Control` |
        |---|---|
        | a **tag**, named directly | `public, max-age=31536000, immutable` — the artifact cannot change, so nothing weaker would be truthful |
        | an **environment** | `public, max-age=<short>` — it moves on every promotion, and a rollback must be seen |
        | a **live** ref | `no-cache` — its content moves with every write, so any freshness claim would be a guess |

        ⚠️ **An environment is never `immutable`**, even though the tag behind it
        is. That would pin a cache to the release it first saw for a year,
        rollbacks included. The short `max-age` is an implementation default, not
        a contract value: a client may depend on an environment never being
        `immutable`, and on nothing about the number.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Entry:
      type: object
      required: [id, type, fields]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        type:
          type: string
          description: The content type's slug **as resolved on this ref** (D24).
        locale:
          type: string
          description: |
            The locale this projection was made for. Absent when none was
            requested.
        fields:
          type: object
          additionalProperties: true
          description: |
            The resolved node body, projected to one locale and flattened. A
            localized field untranslated in this locale is **absent**, not null.

    EntryListResponse:
      type: object
      required: [entries, hasMore]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        hasMore:
          type: boolean
          description: Whether another page exists after this one.

    Problem:
      type: object
      required: [code, title, status]
      properties:
        code:
          type: string
          description: |
            The stable identifier clients branch on. Status is deliberately
            coarse, so a client switching on status is switching on almost nothing.
          enum: [REF_NOT_FOUND, ENTRY_NOT_FOUND, INVALID_QUERY]
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
