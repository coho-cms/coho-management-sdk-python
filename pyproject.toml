[project]
name = "coho-sdk"
description = "Management SDK for Coho: accounts, projects, refs, content, releases, delivery keys."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "sdk", "content"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "tomli-w>=1.0",
]
# The version lives in one place: src/coho_sdk/_version.py, read by hatchling below.
dynamic = ["version"]

[project.optional-dependencies]
# Read tokens the CLI stored in the OS keyring.
keyring = ["keyring>=25"]
# coho_sdk.testing.FakeBff, for testing your own code against a contract-shaped fake.
testing = ["pytest-httpserver>=1.1", "werkzeug>=3.0"]

[project.urls]
Homepage = "https://github.com/coho-cms/coho-sdk-python"
Source = "https://github.com/coho-cms/coho-sdk-python"
Documentation = "https://github.com/coho-cms/coho-sdk-python/tree/main/docs"
Changelog = "https://github.com/coho-cms/coho-sdk-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/coho-cms/coho-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/coho_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_sdk"]

[tool.hatch.build.targets.sdist]
# What a source distribution carries beyond the package: enough to run the suite
# and to see which contracts this version implements.
include = [
    "src/coho_sdk",
    "tests",
    "contracts",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-httpserver>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "keyring>=25",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Python only. Recent ruff also formats Python blocks inside Markdown, which would
# rewrite the deliberately aligned samples in docs/.
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pytest-httpserver and werkzeug ship types, but only the testing extra installs them.
module = ["pytest_httpserver.*", "werkzeug.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
